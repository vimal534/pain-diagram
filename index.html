<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pain Diagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #e6f7f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #root {
        width: 390px;
        height: 844px;
        position: relative;
        overflow: hidden;
        border-radius: 44px;
        box-shadow: 0px 40px 80px rgba(13,148,136,0.18), 0px 0px 0px 1px rgba(0,0,0,0.08);
        background: #fff;
      }
      /* Scale down on screens smaller than the phone frame */
      @media (max-height: 900px) {
        body { align-items: flex-start; padding: 20px 0; }
        #root {
          transform-origin: top center;
          transform: scale(calc(min((100vh - 40px) / 844px, 1)));
          margin-bottom: calc((1 - min((100vh - 40px) / 844px, 1)) * -844px);
        }
      }
      @media (max-width: 430px) {
        body { padding: 0; align-items: stretch; }
        #root {
          width: 100%;
          height: 100vh;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
          transform: none;
          margin-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
